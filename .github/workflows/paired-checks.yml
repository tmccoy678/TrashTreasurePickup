name: Pickup checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - name: Check out the complete project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Documentation and syntax
        run: python3 scripts/check_publication.py
      - name: Regression suite with fixture downloads and scanner
        run: python3 -m unittest discover -s tests -v
      - name: Verify installer against its declared source
        run: |
          python3 installer/bundle.py --output dist/pickup-install.command --verify
          shasum -a 256 dist/pickup-install.command
