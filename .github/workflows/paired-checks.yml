name: Pickup checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - name: Check out the complete project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Documentation and syntax
        run: python3 scripts/check_publication.py
      - name: Installer and bundle tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify installer against its declared source
        run: |
          python3 installer/bundle.py --output dist/pickup-install.command --verify
          shasum -a 256 dist/pickup-install.command
